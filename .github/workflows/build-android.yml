name: Build Lumi Android APK

on:
  push:
    branches:
      - fertility-engine-dev
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
      - 'www/**'
      - 'app/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lumi
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor Android tooling
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Apply Lumi login logo as launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_lumi_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F7A9C4" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,16 C62,16 66,24 63,32 C71,27 81,31 81,40 C81,48 73,52 65,49 C73,57 70,68 61,71 C54,74 49,67 49,59 C45,68 34,70 28,63 C22,56 27,47 35,44 C25,45 19,36 24,28 C29,20 40,22 45,30 C43,21 47,16 54,16 Z"/>
              <path android:fillColor="#F7A9C4" android:pathData="M54,39a7,7 0,1 0,0 14a7,7 0,1 0,0 -14"/>
              <path android:fillColor="#FFFFFF" android:pathData="M82,17l2.5,6.5 6.5,2.5 -6.5,2.5 -2.5,6.5 -2.5,-6.5 -6.5,-2.5 6.5,-2.5z"/>
          </vector>
          XML
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_lumi_launcher"')
          p.write_text(s)
          PY

      - name: Run Lumi fertility-engine tests
        run: npm test

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Lumi debug APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Configure permanent Lumi release signing
        if: ${{ secrets.LUMI_KEYSTORE_BASE64 != '' }}
        env:
          LUMI_KEYSTORE_BASE64: ${{ secrets.LUMI_KEYSTORE_BASE64 }}
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          echo "$LUMI_KEYSTORE_BASE64" | base64 --decode > android/app/lumi-release-key.p12
          cat > android/app/release-signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("LUMI_KEYSTORE_PATH"))
                      storePassword System.getenv("LUMI_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("LUMI_KEY_ALIAS")
                      keyPassword System.getenv("LUMI_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          printf "\napply from: 'release-signing.gradle'\n" >> android/app/build.gradle

      - name: Build signed Lumi release APK
        if: ${{ secrets.LUMI_KEYSTORE_BASE64 != '' }}
        working-directory: android
        env:
          LUMI_KEYSTORE_PATH: app/lumi-release-key.p12
          LUMI_KEYSTORE_PASSWORD: ${{ secrets.LUMI_KEYSTORE_PASSWORD }}
          LUMI_KEY_ALIAS: ${{ secrets.LUMI_KEY_ALIAS }}
          LUMI_KEY_PASSWORD: ${{ secrets.LUMI_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --verbose app/build/outputs/apk/release/app-release.apk
          rm -f app/lumi-release-key.p12

      - name: Upload signed Lumi release APK
        if: ${{ secrets.LUMI_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: lumi-user-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
