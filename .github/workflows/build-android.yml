name: Build Lumi Android APK

on:
  push:
    branches:
      - fertility-engine-dev
      - fix-mobile-layout
    paths:
      - 'capacitor.config.json'
      - '.github/workflows/build-android.yml'
      - 'www/**'
      - 'app/**'
      - 'lib/**'
      - 'public/icons/lumi.svg'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Lumi
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor Android tooling and icon renderer
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 sharp
          npx cap add android
          npx cap sync android

      - name: Apply the original Lumi flower logo as Android launcher icon
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          const densities = [
            ['mdpi', 48],
            ['hdpi', 72],
            ['xhdpi', 96],
            ['xxhdpi', 144],
            ['xxxhdpi', 192],
          ];
          for (const [density, size] of densities) {
            const dir = `android/app/src/main/res/mipmap-${density}`;
            await mkdir(dir, { recursive: true });
            await sharp('public/icons/lumi.svg')
              .resize(size, size)
              .png()
              .toFile(`${dir}/ic_launcher.png`);
          }
          NODE
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@mipmap/ic_launcher"', s)
          s = s.replace('android:icon="@drawable/ic_lumi_launcher"', 'android:icon="@mipmap/ic_launcher"')
          p.write_text(s)
          PY

      - name: Run Lumi fertility-engine and application tests
        run: npm test

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -s "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Android debug APK signature verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Lumi Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lumi-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
